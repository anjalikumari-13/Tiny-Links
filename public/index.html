<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Links</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff8fb;
        color: #3b2a32;
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(540px, calc(100% - 32px));
        margin: 0 auto;
        padding: 52px 0;
      }

      h1 {
        margin: 0 0 8px;
        color: #8f3d63;
        font-size: 38px;
        font-weight: normal;
      }

      .subtitle {
        margin: 0 0 26px;
        color: #75616a;
        line-height: 1.5;
      }

      form,
      .links {
        background: #ffffff;
        border: 1px solid #efd0df;
        border-radius: 12px;
        box-shadow: 0 10px 26px rgba(143, 61, 99, 0.1);
        padding: 24px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #e6c2d3;
        border-radius: 8px;
        font: inherit;
        padding: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #b6507b;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
        padding: 11px 20px;
      }

      button:hover {
        background: #963d66;
      }

      .links {
        margin-top: 22px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      li {
        margin: 8px 0;
        overflow-wrap: anywhere;
      }

      a {
        color: #8f3d63;
        font-weight: bold;
      }

      .error,
      .success {
        margin-top: 10px;
        padding: 10px;
        border-radius: 4px;
        display: none;
      }

      .error {
        color: #d32f2f;
        background: #ffebee;
      }

      .success {
        color: #388e3c;
        background: #e8f5e9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tiny Links</h1>
      <p class="subtitle">A small place to keep neat links for resumes, bios, and anywhere a long URL feels messy.</p>

      <form id="linkForm">
        <p>
          <label for="slug">What should the link say?</label>
          <input id="slug" name="slug" placeholder="github" required />
        </p>

        <p>
          <label for="url">Where should it go?</label>
          <input id="url" name="url" placeholder="https://github.com/your-name" required />
        </p>

        <button type="submit">Add link</button>
      </form>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <section class="links">
        <h2>My saved links</h2>
        <ul id="linksList">
          <li>Loading...</li>
        </ul>
      </section>
    </main>

    <script>
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function loadLinks() {
        try {
          const response = await fetch("/api/links");
          const links = await response.json();
          const linksList = document.getElementById("linksList");

          if (Object.keys(links).length === 0) {
            linksList.innerHTML = "<li>No links yet.</li>";
            return;
          }

          linksList.innerHTML = Object.entries(links)
            .map(([slug, url]) => {
              const safeSlug = encodeURIComponent(slug);
              return `<li><a href="/s/${safeSlug}">/s/${escapeHtml(slug)}</a> - ${escapeHtml(url)}</li>`;
            })
            .join("");
        } catch (error) {
          document.getElementById("linksList").innerHTML = "<li>Error loading links.</li>";
        }
      }

      document.getElementById("linkForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const slug = document.getElementById("slug").value;
        const url = document.getElementById("url").value;
        const errorDiv = document.getElementById("error");
        const successDiv = document.getElementById("success");

        errorDiv.style.display = "none";
        successDiv.style.display = "none";

        try {
          const response = await fetch("/api/links", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ slug, url }),
          });
          const result = await response.json();

          if (!response.ok) {
            errorDiv.textContent = result.error || "Error creating link.";
            errorDiv.style.display = "block";
            return;
          }

          successDiv.textContent = `Link created: /s/${result.slug}`;
          successDiv.style.display = "block";
          document.getElementById("linkForm").reset();
          loadLinks();
        } catch (error) {
          errorDiv.textContent = error.message || "Error creating link.";
          errorDiv.style.display = "block";
        }
      });

      loadLinks();
    </script>
  </body>
</html>
